<!DOCTYPE html>
<html>
  <head>
    <title>DevExtreme jQuery app</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" type="text/css" href="../../node_modules/devextreme-dist/css/dx.fluent.blue.light.css" />
    <link rel="stylesheet" type="text/css" href="../shared.css" />
    <link rel="stylesheet" type="text/css" href="popup.css" />
    <script type="text/javascript" src="../../node_modules/jquery/dist/jquery.js"></script>
    <script type="text/javascript" src="../../node_modules/devextreme-dist/js/dx.all.js"></script>
    <script type="text/javascript" src="../devextreme-license.js"></script>

      import { unified } from "https://esm.sh/unified@11?bundle";
      import remarkParse from "https://esm.sh/remark-parse@11?bundle";
      import remarkRehype from "https://esm.sh/remark-rehype@11?bundle";

      window.AzureOpenAI = AzureOpenAI;
      window.APIUserAbortError = APIUserAbortError;
      window.unified = unified;
      window.remarkParse = remarkParse;
      window.remarkRehype = remarkRehype;
      window.rehypeMinifyWhitespace = rehypeMinifyWhitespace;
      window.rehypeStringify = rehypeStringify;
    </script>
  </head>

  <body class="dx-viewport">
    <div class="demo-container">
      <div id="open-drawer-button"></div>
      <div id="popup"></div>
    </div>
